services:
  - type: web
    name: ai-trading-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SIMULATE
        value: "true"
      - key: DEMO_TOKEN
        value: DEMO-1234
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_USER
        value: admin
      - key: DASHBOARD_PASSWORD
        sync: false
